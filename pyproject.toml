[project]
name = "dealfactory"
version = "0.1.0"
description = "Personal AI shopping advisor: environment-aware recommendations, sourced specs and live offers"
readme = "README.md"
authors = [{ name = "DealFactory contributors" }]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.12.0",
    "google-auth-oauthlib>=1.5.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "mcp>=2.3.0",
    "pydantic>=2.14.4",
    "pypdf>=7.1.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
]

[project.scripts]
dealfactory = "dealfactory.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
