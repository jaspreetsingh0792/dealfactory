name: DealFactory site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealfactory-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: node --test web/tests/*.test.mjs
      - run: uv run --locked pytest -q
      - run: uv run --locked python ops/build_public.py "${RUNNER_TEMP}/dealfactory-test" --site-url https://dealfactory.example

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.CLOUDFLARE_PAGES_PROJECT != ''
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: Verify and publish current offers
        run: |
          set -o pipefail
          uv run --locked python ops/build_public.py "${RUNNER_TEMP}/dealfactory" \
            --site-url "$SITE_URL" --analytics-token "$WEB_ANALYTICS_TOKEN" --refresh | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Deploy tested public assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npm exec --yes --package=wrangler@4 -- wrangler pages deploy "${RUNNER_TEMP}/dealfactory" \
            --project-name "$PAGES_PROJECT" --branch main
      - name: Check production routes
        run: |
          for route in / /guides/stroller-footmuffs/ /sitemap.xml /robots.txt; do
            url="${SITE_URL%/}${route}"
            curl --fail --silent --show-error --location --max-time 20 --retry 3 --output /dev/null "$url"
            printf 'Reachable: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          done
