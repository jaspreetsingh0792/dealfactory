name: DealFactory site

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dealfactory-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - run: node --test web/tests/*.test.mjs
      - run: uv run --locked pytest -q
      - name: Exercise Pages traffic counter with local D1
        if: github.event_name == 'pull_request'
        run: bash ops/test_pages_counter.sh
      - run: uv run --locked python ops/build_public.py "${RUNNER_TEMP}/dealfactory-test" --site-url https://dealfactory.example

  storefront:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - name: Check desktop and mobile storefront
        run: |
          uv run --locked python ops/build_public.py "$RUNNER_TEMP/storefront" --refresh --site-url https://dealfactory.example --google-client-id qa.apps.googleusercontent.com
          npm install --prefix "$RUNNER_TEMP/browser-qa" --no-save playwright-core@1.56.1
          python3 -m http.server 8764 --bind 127.0.0.1 --directory "$RUNNER_TEMP/storefront" > "$RUNNER_TEMP/server.log" 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          curl -fsS --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8764/ -o /dev/null
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node ops/test_storefront.cjs "$RUNNER_TEMP/screens"
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node ops/test_deals_chips.cjs "$RUNNER_TEMP/screens"
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node ops/test_product_page.cjs "$RUNNER_TEMP/screens"
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node ops/test_privacy_stats.cjs
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node ops/test_connections.cjs
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node ops/test_gmail_lock.cjs "$RUNNER_TEMP/screens"
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node ops/test_manual_entry.cjs "$RUNNER_TEMP/screens"
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node ops/test_provider_picker.cjs "$RUNNER_TEMP/screens"
          NODE_PATH="$RUNNER_TEMP/browser-qa/node_modules" node ops/test_gmail_progress.cjs "$RUNNER_TEMP/screens"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-previews
          path: ${{ runner.temp }}/screens/*.jpg
          retention-days: 3

  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: read
      statuses: write
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SITE_URL: ${{ vars.SITE_URL }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      WEB_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_WEB_ANALYTICS_TOKEN }}
      GOOGLE_CLIENT_ID: ${{ vars.DEALFACTORY_GOOGLE_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare Cloudflare Pages project
        id: pages
        env:
          CUSTOM_DOMAIN: ${{ github.repository == 'jaspreetsingh0792/dealfactory' && 'deals.agentsealteam.com' || '' }}
          PAGES_CREDENTIALS: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 ops/configure_pages.py
      - uses: actions/setup-node@v4
        if: steps.pages.outputs.ready == 'true'
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
        if: steps.pages.outputs.ready == 'true'
      - name: Prepare aggregate traffic measurement
        id: traffic
        if: steps.pages.outputs.ready == 'true'
        env:
          PAGES_CREDENTIALS: ${{ secrets.CLOUDFLARE_PAGES_DEPLOY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 ops/traffic.py
      - name: Verify and publish current offers
        if: steps.pages.outputs.ready == 'true'
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
        run: |
          set -o pipefail
          flags=()
          if [[ -f "$RUNNER_TEMP/dealfactory-traffic.json" ]]; then
            flags+=(--traffic-file "$RUNNER_TEMP/dealfactory-traffic.json")
          fi
          uv run --locked python ops/build_public.py "${RUNNER_TEMP}/dealfactory" \
            --site-url "${SITE_URL:-$PAGES_URL}" --analytics-token "$WEB_ANALYTICS_TOKEN" --google-client-id "$GOOGLE_CLIENT_ID" --refresh --history-url "$PAGES_URL/offer-history.json" "${flags[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cache open-source editorial model
        if: steps.pages.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/dealfactory-model
          key: qwen-editor-74a4da8c
      - name: Select and apply today's editorial angle
        if: steps.pages.outputs.ready == 'true'
        timeout-minutes: 6
        continue-on-error: true
        run: bash ops/run_editor.sh "$RUNNER_TEMP/dealfactory"
      - name: Restore search submission history
        if: steps.pages.outputs.ready == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/dealfactory-search
          key: search-submissions-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: search-submissions-
      - name: Publish search ownership file
        if: steps.pages.outputs.ready == 'true'
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
        run: python3 ops/search_updates.py prepare "$RUNNER_TEMP/dealfactory" "$RUNNER_TEMP/dealfactory-search" "${SITE_URL:-$PAGES_URL}"
      - name: Deploy tested public assets
        if: steps.pages.outputs.ready == 'true'
        env:
          PAGES_PROJECT: ${{ steps.pages.outputs.project }}
          DATABASE_ID: ${{ steps.traffic.outputs.database }}
          CLOUDFLARE_ACCOUNT_ID: ${{ fromJSON(secrets.CLOUDFLARE_PAGES_DEPLOY || '{}').account_id || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ fromJSON(secrets.CLOUDFLARE_PAGES_DEPLOY || '{}').api_token || secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -n "$DATABASE_ID" ]]; then
            jq -n --arg project "$PAGES_PROJECT" --arg db "$DATABASE_ID" \
              --arg assets "$RUNNER_TEMP/dealfactory" \
              '{name:$project,pages_build_output_dir:$assets,compatibility_date:"2025-04-01",
              d1_databases:[{binding:"TRAFFIC",database_name:"dealfactory-traffic",database_id:$db}]}' > wrangler.json
          fi
          npm exec --yes --package=wrangler@4 -- wrangler pages deploy "${RUNNER_TEMP}/dealfactory" \
            --project-name "$PAGES_PROJECT" --branch main
      - name: Check production routes
        if: steps.pages.outputs.ready == 'true'
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
        run: |
          origin="${SITE_URL:-$PAGES_URL}"
          for route in / /guides/smart-home-compatibility/ /deals/ /about/ /terms/ /sitemap.xml /robots.txt; do
            url="${origin%/}${route}"
            curl --fail --silent --show-error --location --max-time 20 --retry 3 --output /dev/null "$url"
            printf 'Reachable: %s\n' "$url" >> "$GITHUB_STEP_SUMMARY"
          done
          python3 ops/check_live.py "$RUNNER_TEMP/dealfactory" "$origin"
          if [[ -f "$RUNNER_TEMP/dealfactory-traffic.json" ]]; then
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Origin: $origin" -H "DNT: 1" "$origin/events?page=home&event=view")
            test "$code" = 204
          fi
      - name: Notify search engines of changed pages
        if: steps.pages.outputs.ready == 'true'
        continue-on-error: true
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
        run: python3 ops/search_updates.py submit "$RUNNER_TEMP/dealfactory" "$RUNNER_TEMP/dealfactory-search" "${SITE_URL:-$PAGES_URL}"
      - name: Save search submission history
        if: steps.pages.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/dealfactory-search
          key: search-submissions-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Record production check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_RESULT: ${{ job.status }}
          READY: ${{ steps.pages.outputs.ready }}
        run: |
          result=failure
          if [[ "$JOB_RESULT" == success && "$READY" == true ]]; then result=success; fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$result" -f context=dealfactory/production \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f description="Deployment and production route checks" --silent
